*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:20px}
header{

button{background:var(--primary);color:#fff;border:0;width:auto;margin:3px 2px;font-weight:500;transition:.2s;cursor:pointer}
button:active{transform:scale(.97)}
button.r{background:#e53935}button.g{background:#78909c}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}

#out.fg .bd,#out.fb .gd{display:none}

.Y{color:#f57f17;font-weight:600}

table{border-collapse:collapse;width:100%;font-size:13px;border-radius:10px;overflow:hidden}
th,td{border:1px solid #e0e0e0;padding:6px 8px;text-align:left}

function sunRiseSet(date, lat, lon, tz) {
  const d = new Date(date);
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  const oneDay = 1000 * 60 * 60 * 24;
  const dayOfYear = Math.floor(diff / oneDay);
  const decl = 23.45 * Math.sin(2 * Math.PI / 365 * (dayOfYear - 81)) * R;
  const latRad = lat * R;
  const cosH = -Math.tan(latRad) * Math.tan(decl);
  if (cosH < -1 || cosH > 1) return null;
  const H = Math.acos(cosH) / R;
  const B = 2 * Math.PI * (dayOfYear - 81) / 364;
  const eqtime = 9.87 * Math.sin(2*B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const solarNoon = 12 - eqtime/60 - lon/15 + tz;
  const sunrise = solarNoon - H/15;
  const sunset = solarNoon + H/15;
  const rise = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(sunrise), Math.round((sunrise%1)*60));
  const set = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(sunset), Math.round((sunset%1)*60));
  return {rise, set};
}

function panchang(p, t) {
  const d = new Date(t);
  const wd = d.getDay();
  const sr = sunRiseSet(d, p.la, p.lo, p.z);
  if (!sr) { $("pan").innerHTML = "આ સ્થળે સૂર્યોદય/સૂર્યાસ્ત ગણી શકાય નહીં."; return; }
  const {rise, set} = sr;
  const nextDay = new Date(d);
  nextDay.setDate(d.getDate() + 1);
  const nr = sunRiseSet(nextDay, p.la, p.lo, p.z);
  const nextRise = nr ? nr.rise : new Date(set.getTime() + 12*3600*1000);
  const brahma = new Date(rise.getTime() - 96*60*1000);

  const tp = pos(new Date(t));
  const sunLon = tp[0], moonLon = tp[1];
  const diff = (moonLon - sunLon + 360) % 360;
  const tithiIdx = Math.floor(diff / 12) % 30;
  let tithiName, paksha;
  if (tithiIdx < 15) { tithiName = TITHI[tithiIdx]; paksha = "શુક્લ"; }
  else { tithiName = TITHI_K[tithiIdx - 15]; paksha = "કૃષ્ણ"; }

  const dayDur = set - rise;
  const nightDur = nextRise - set;
  const dayParts = [], nightParts = [];
  for (let i = 0; i < 8; i++) {
    const start = new Date(rise.getTime() + dayDur * i / 8);
    const end = new Date(rise.getTime() + dayDur * (i+1) / 8);
    dayParts.push({start, end, name: CHOGH_DAY[wd][i]});
  }
  for (let i = 0; i < 8; i++) {
    const start = new Date(set.getTime() + nightDur * i / 8);
    const end = new Date(set.getTime() + nightDur * (i+1) / 8);
    nightParts.push({start, end, name: CHOGH_NIGHT[wd][i]});
  }

  const dayHoraDur = dayDur / 12;
  const nightHoraDur = nightDur / 12;
  const weekdayLord = WEEKDAY_LORDS[wd];
  const lordIdx = HORA_PLANETS.indexOf(weekdayLord);
  const horas = [];
  for (let i = 0; i < 12; i++) {
    const start = new Date(rise.getTime() + dayHoraDur * i);
    const end = new Date(rise.getTime() + dayHoraDur * (i+1));
    horas.push({start, end, planet: HORA_PLANETS[(lordIdx + i) % 7]});
  }
  for (let i = 0; i < 12; i++) {
    const start = new Date(set.getTime() + nightHoraDur * i);
    const end = new Date(set.getTime() + nightHoraDur * (i+1));
    horas.push({start, end, planet: HORA_PLANETS[(lordIdx + 12 + i) % 7]});
  }

  const allChogh = [...dayParts, ...nightParts];
  let curChogh = null, curHora = null;
  allChogh.forEach(c => {
    if (t >= c.start.getTime() && t < c.end.getTime()) curChogh = c;
  });
  horas.forEach(h => {
    if (t >= h.start.getTime() && t < h.end.getTime()) curHora = h;
  });

  const fmt = d => d.toLocaleTimeString('gu-IN', {hour:'2-digit', minute:'2-digit'});
  const fmtEnd = d => d.toLocaleTimeString('gu-IN', {hour:'2-digit', minute:'2-digit'});

  let html = `<div class="sunbox">
    <b>📅 ${d.toLocaleDateString('gu-IN')}</b> • ${["રવિ","સોમ","મંગળ","બુધ","ગુરુ","શુક્ર","શનિ"][wd]}<br>
    ☀️ સૂર્યોદય: <b>${fmt(rise)}</b> &nbsp; 🌇 સૂર્યાસ્ત: <b>${fmt(set)}</b><br>
    🕉️ બ્રહ્મ મુહૂર્ત: <b>${fmt(brahma)}</b> થી <b>${fmt(rise)}</b><br>
    🌙 તિથિ: <b>${paksha} ${tithiName}</b>
  </div>`;

  if (curChogh || curHora) {
    const cg = curChogh ? curChogh.name : "—";
    const hr = curHora ? curHora.planet : "—";
    const yChogh = curChogh && YATRA_GOOD_CHOGH.includes(cg);
    const yHora  = curHora  && YATRA_GOOD_HORA.includes(hr);
    let yatraMsg;
    if (yChogh && yHora) yatraMsg = "<span class='yatra-good'>🚗 યાત્રા માટે ઉત્તમ સમય! હવે નીકળી શકાય.</span>";
    else if (yChogh || yHora) yatraMsg = "<span class='yatra-mid'>🚗 યાત્રા થોડી સારી છે, પણ આખું શ્રેષ્ઠ નથી.</span>";
    else yatraMsg = "<span class='yatra-bad'>🚫 યાત્રા ટાળો. બીજો સારો સમય જુઓ.</span>";

    html += `<div class="now-box">
      <div class="title">🕐 અત્યારે ચાલુ <span class="badge">LIVE</span></div>
      <div class="item">⏳ ચોઘડિયું: <b>${cg}</b> ${curChogh ? `<small>(${fmt(curChogh.start)} – ${fmtEnd(curChogh.end)})</small>` : ""}</div>

  });
  html += `</table></div>`;

  html += `<div style="background:#fff3e0;padding:10px;border-radius:12px;margin-top:10px;border-left:4px solid #ef6c00;font-size:13px;line-height:1.8">
    <b style="color:#e65100">🚗 યાત્રા માટે શ્રેષ્ઠ સમય</b><br>
    <b>ચોઘડિયામાં:</b> <span class="yatra-good">ચલ • લાભ • અમૃત • શુભ</span><br>
    <b>હોરામાં:</b> <span class="yatra-good">ચંદ્ર • બુધ • શુક્ર • ગુરુ</span><br>
    <b>ટાળો:</b> <span class="yatra-bad">કાળ • રોગ • ઉદ્વેગ (ચોઘડિયા) | શનિ • મંગળ (હોરા)</span>
  </div>`;

  $("pan").innerHTML = html;
}

function emptyUI(){
  $("nat").innerHTML = `<div class="empty-msg">
    <div class="big">👤</div>
    <b>કોઈ પ્રોફાઇલ નથી</b><br>
    ઉપર <b>➕ નવી</b> દબાવીને<br>તમારી પ્રોફાઇલ ઉમેરો 🙏
  </div>`;
  $("ch").innerHTML = "";
  $("ss").innerHTML = "";
  $("ds").innerHTML = "";
  $("sum").innerHTML = "";
  $("out").innerHTML = "";
}

function ui(){
  if(!L.length){
    $("ps").innerHTML = '<option>-- પ્રોફાઇલ નથી --</option>';
    return;
  }
  $("ps").innerHTML = L.map((p,i)=>`<option value="${i}" ${i==cur?"selected":""}>${esc(p.n)}</option>`).join("");
  $("ps").onchange = ()=>{cur=+$("ps").value;sv();go()};
}
$("fc").innerHTML = Object.keys(CITY).map(c=>`<option>${c}</option>`).join("");
function city(){const v=CITY[$("fc").value];if(v[0]){$("fla").value=v[0];$("flo").value=v[1]}}
function openF(e){
  if(e && !L.length){alert("પહેલા પ્રોફાઇલ ઉમેરો 🙏");return}
  edit=e?cur:-1;
  const p=e?L[cur]:{n:"",d:"",t:"",la:23.25,lo:69.67,z:5.5};
  $("ft").textContent=e?"✏️ સુધારો":"➕ નવી પ્રોફાઇલ";
  $("fn").value=p.n;$("fd").value=p.d;$("fti").value=p.t;
  $("fla").value=p.la;$("flo").value=p.lo;$("ftz").value=p.z;
  const key=Object.keys(CITY).find(k=>Math.abs(CITY[k][0]-p.la)<0.02&&Math.abs(CITY[k][1]-p.lo)<0.02);
  $("fc").value = key||"અન્ય (હાથે લખો)";
  $("m").style.display="block";
}
function save(){
  const p={n:$("fn").value.trim(),d:$("fd").value,t:$("fti").value,la:+$("fla").value,lo:+$("flo").value,z:+$("ftz").value};
  if(!p.n||!p.d||!p.t||!isFinite(p.la)||!isFinite(p.lo)||!isFinite(p.z)){alert("બધી વિગત ભરો 🙏");return}
  if(edit>=0)L[edit]=p;else{L.push(p);cur=L.length-1}
  sv();$("m").style.display="none";ui();go();
}
function del(){
  if(!L.length){alert("કોઈ પ્રોફાઇલ નથી");return}
  if(confirm(L[cur].n+" ને ડિલીટ કરવા છે?")){
    L.splice(cur,1);
    cur=Math.max(0,Math.min(cur,L.length-1));
    sv();ui();
    if(L.length) go(); else emptyUI();
  }
}
function now(){
  const d=new Date(Date.now()-new Date().getTimezoneOffset()*6e4);
  $("dt").value=d.toISOString().slice(0,16);
  if(L.length) go(); else emptyUI();
}

const rz=(i,t)=>Math.floor(pos(new Date(t))[i]/30);
function span(i,t0){const r=rz(i,t0),st=[.1,1,1,1,4,1,5,8,8][i]*864e5,lim=[40,70,300,150,700,200,1100,800,800][i]*864e5;
let a=t0,b=t0;while(t0-a<lim&&rz(i,a-st)==r)a-=st;while(b-t0<lim&&rz(i,b+st)==r)b+=st;
let lo=a-st,hi=a;for(let k=0;k<14;k++){const m=(lo+hi)/2;rz(i,m)==r?hi=m:lo=m}a=hi;
lo=b;hi=b+st;for(let k=0;k<14;k++){const m=(lo+hi)/2;rz(i,m)==r?lo=m:hi=m}b=lo;return[a,b]}
const fd=t=>{const d=new Date(t);return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()},
dur=ms=>{ms=Math.max(0,ms);const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4);
if(d>=60)return Math.round(d/30.4)+" મહિના";
if(d>0)return d+" દિવસ "+h+" કલાક";
if(h>0)return h+" કલાક "+mi+" મિનિટ";
return mi+" મિનિટ";};

function go(){
  if(!L.length){emptyUI();return}
  const p=L[cur];
  if(!$("dt").value){now();return}
  const t=new Date($("dt").value).getTime(),b=birth(p),np=pos(new Date(b)),lg=lagna(p,b),
  base=ref?Math.floor(np[1]/30):Math.floor(lg/30);
  $("t0").className=ref?"":"on";$("t1").className=ref?"on":"";
  $("nat").innerHTML=`🌅 લગ્ન: <b>${RA[Math.floor(lg/30)]}</b> &nbsp; 🌙 રાશિ: <b>${RA[Math.floor(np[1]/30)]}</b><br>⭐ નક્ષત્ર: <b>${NK[Math.floor(np[1]/(360/27))]}</b>`;
  const tp=pos(new Date(t));
  $("tm").className=T?"":"on";$("tn").className=T?"on":"";
  let g=0,A=[];
  const pn=pos(new Date(t+864e5)),pb=pos(new Date(t-864e5));
  const vk=i=>((pn[i]-pb[i]+540)%360)-180<0;
  tp.forEach((x,i)=>{
    if((MJ.includes(i)?0:1)!=T)return;
    const r=Math.floor(x/30),hs=(r-base+12)%12+1,ok=P[i][2].includes(hs);
    ok&&g++;
    const[f,to]=span(i,t),pc=Math.min(100,Math.max(0,(t-f)/(to-f)*100)).toFixed(0);
    A.push({r:to-t,h:`<div class="pl ${ok?'gd':'bd'}"><div class="ph"><span>${P[i][0]} ${P[i][1]}</span><span class="${ok?"G":"B"}">${ok?"✅ સારું":"🔴 ખરાબ"}</span></div><div class="pb">
    📍 ${RA[r]} રાશિ • ${hs}મું ઘર ${i<2?"":vk(i)?"• ↩️ વક્રી":"• ▶️ માર્ગી"}<br>
    <div class="bar"><i style="width:${pc}%"></i></div>${pc}% પૂર્ણ<br>
    📅 ${fd(f)} થી ${fd(to)}<br>⏳ બાકી: ${dur(to-t)}
    <br><button onclick="var e=this.nextElementSibling;e.style.display=e.style.display=='block'?'none':'block'">📖 વિગત અને ઉપાય</button>
    <div class="dt"><b>${hs}મું ઘર:</b> ${HM[hs-1]} ક્ષેત્રે ${ok?"સારું ફળ મળવાની શક્યતા. 👍 તકનો લાભ લો.":"સાવધાની જરૂરી. ⚠️ ઉતાવળા નિર્ણય ટાળો."}<br><br>${ok?"👍":"⚠️"} ${ok?X[i][0]:X[i][1]}<br><b>🙏 ઉપાય:</b> ${P[i][3]}.<br>${X[i][2]}<br>ઉપાય શ્રદ્ધા માટે છે. આરોગ્ય-નાણાં બાબતે નિષ્ણાતની સલાહ લો.</div></div></div>`});
  });
  $("sum").innerHTML=`<div class="row"><button style="background:#2e7d32" onclick="fl(1)">✅ સારું (${g})</button><button class="r" onclick="fl(0)">🔴 ખરાબ (${A.length-g})</button></div>`;
  $("out").innerHTML=A.sort((x,y)=>x.r-y.r).map(x=>x.h).join("");
  $("out").className=F===1?"fg":F===0?"fb":"";
  $("sum").children[0].children[0].style.opacity=F===0?.4:1;
  $("sum").children[0].children[1].style.opacity=F===1?.4:1;
  panchang(p, t);
  extra(b,np,lg,t,tp);
}

function extra(b,np,lg,t,tp){
  const m=Math.floor(np[1]/30),sr=Math.floor(tp[6]/30),df=(sr-m+12)%12,e=fd(span(6,t)[1]);
  let s;
  if([11,0,1].includes(df))s=`🔱 <b>સાડાસાતી ચાલુ છે</b> (${["પ્રથમ","બીજું","ત્રીજું"][df==11?0:df+1]} ચરણ)<br>શનિ હાલ ${RA[sr]} રાશિમાં છે, ${e} સુધી.`;
  else if(df==3||df==7)s=`⚠️ <b>નાની પનોતી ચાલુ છે</b> (ચંદ્રથી ${df==3?"ચોથા":"આઠમા"} ઘરે શનિ)<br>શનિ હાલ ${RA[sr]} રાશિમાં છે, ${e} સુધી.`;
  else s=`✅ હાલ સાડાસાતી કે નાની પનોતી નથી.<br>શનિ ${RA[sr]} રાશિમાં, ${e} સુધી.`;
  $("ss").innerHTML=s+"<br>🙏 "+P[6][3]+"<br><br><b>📅 સાડાસાતીના સમયગાળા:</b>"+ssList(m,t).map(([a,z])=>`<div style="padding:4px;${t>=a&&t<=z?"background:#e0f2f1;font-weight:bold":""}">${fd(a)} થી ${fd(z)} ${t>=a&&t<=z?"(ચાલુ)":t>z?"(પૂરી)":"(આગામી)"}</div>`).join("");
  const nk=360/27,x=np[1],o=Math.floor(x/nk)%9,fr=1-(x%nk)/nk;
  let st=b-(1-fr)*DY[o]*YD,cur="",rows="";
  for(let k=0;k<9;k++){
    const i=(o+k)%9,en=st+DY[i]*YD,on=t>=st&&t<en;
    if(on){
      let as=st,ah="";
      for(let q=0;q<9;q++){
        const j=(i+q)%9,ae=as+DY[i]*DY[j]/120*YD;
        if(t>=as&&t<ae)ah=`અંતર્દશા: <b>${P[DO[j]][1]}</b> (${fd(as)} – ${fd(ae)})`;
        as=ae;
      }
      cur=`<div style="background:#e0f2f1;padding:8px;border-radius:8px">મહાદશા: <b>${P[DO[i]][1]}</b> (${fd(st)} – ${fd(en)})<br>${ah}</div>`;
    }
    rows+=`<tr style="${on?"font-weight:bold;background:#e0f2f1":""}"><td>${P[DO[i]][0]} ${P[DO[i]][1]}</td><td>${fd(st)}</td><td>${fd(en)}</td></tr>`;
    st=en;
  }
  $("ds").innerHTML=cur+`<table style="width:100%;margin-top:6px;font-size:14px"><tr><th align=left>દશા</th><th align=left>થી</th><th align=left>સુધી</th></tr>${rows}</table>`;
  const l=Math.floor(lg/30),pl=Array.from({length:12},()=>[]);
  np.forEach((v,i)=>pl[(Math.floor(v/30)-l+12)%12].push(SH[i]));
  const c=[[200,95],[100,45],[45,100],[100,200],[45,300],[100,355],[200,305],[300,355],[355,300],[300,200],[355,100],[300,45]];
  let v=`<svg viewBox="0 0 400 400" style="width:100%;max-width:380px"><g stroke="#00796b" fill="none" stroke-width="2"><rect x="2" y="2" width="396" height="396"/><path d="M2 2L398 398M398 2L2 398M200 2L2 200L200 398L398 200Z"/></g>`;
  c.forEach((p,h)=>v+=`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="14" fill="#d32f2f">${(l+h)%12+1}</text><text x="${p[0]}" y="${p[1]+20}" text-anchor="middle" font-size="16" font-weight="bold">${pl[h].join(" ")}</text>`);
  $("ch").innerHTML=v+`</svg><div style="font-size:14px;margin-top:6px">લાલ આંકડો = રાશિ નંબર (1 મેષ … 12 મીન). ઉપરનું મધ્ય ખાનું = લગ્ન.</div>`;
}

function bk(){
  if(!L.length){alert("કોઈ પ્રોફાઇલ નથી");return}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(L)],{type:"application/json"}));
  a.download="gochar-backup.json";a.click();
}
function rs(f){
  const q=new FileReader();
  q.onload=()=>{
    try{
      let n=0;
      JSON.parse(q.result).forEach(p=>{
        if(p.n&&p.d&&!L.some(o=>o.n==p.n&&o.d==p.d&&o.t==p.t)){L.push(p);n++}
      });
      sv();ui();go();
      alert(n+" પ્રોફાઇલ ઉમેરાઈ ✅");
    }catch(e){alert("ફાઇલ બરાબર નથી ❌")}
  };
  q.readAsText(f.files[0]);f.value="";
}
function ssList(m,t){
  const st=30*864e5,on=x=>[11,0,1].includes((Math.floor(pos(new Date(x))[6]/30)-m+12)%12),o=[];
  let a=null,l=null;
  for(let x=t-45*YD;x<=t+35*YD;x+=st){
    if(on(x)){if(a===null)a=x;l=x}
    else if(a!==null&&x-l>400*864e5){o.push([a,l]);a=null}
  }
  if(a!==null)o.push([a,l]);
  return o.map(([a,b])=>{
    let lo=a-st,hi=a;
    for(let k=0;k<10;k++){const c=(lo+hi)/2;on(c)?hi=c:lo=c}
    a=hi;
    lo=b;hi=b+st;
    for(let k=0;k<10;k++){const c=(lo+hi)/2;on(c)?lo=c:hi=c}
    return[a,lo];
  }).filter(p=>p[0]>t-45*YD+40*864e5);
}
function fl(x){F=F===x?null:x;go()}

ui();now();
